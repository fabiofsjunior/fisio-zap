name: TESTES — FisioZap

on:
  push:
    branches: [TESTES]
  pull_request:
    branches: [TESTES, main]
  workflow_dispatch:

concurrency:
  group: fisiozap-testes-ci
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --test scripts/tests/*.test.mjs
      - run: npm run build
      - run: npm run test:agenda-day-range

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Initialize local Supabase config
        run: supabase init --force
      - name: Validate migration dollar quoting
        run: |
          if grep -RInE '^\s*do \$\s*$|^\s*end \$\s*;' supabase/migrations; then
            echo "Invalid PostgreSQL dollar-quoting detected. Use do $ ... end $;."
            exit 1
          fi
      - name: Start local Supabase database only
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Reset from migrations
        run: supabase db reset --local --no-seed
      - name: Lint local schema
        run: supabase db lint --local --fail-on error --schema public
      - name: Run pgTAP clinical trigger tests
        run: supabase test db --local

  rls:
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: npm install --no-audit --no-fund
      - name: Start isolated local Supabase
        run: |
          supabase init --force
          supabase start
          supabase db reset --local --no-seed
      - name: Bootstrap accounts and verify cross-organization RLS
        run: |
          eval "$(supabase status -o env)"
          export FISIOZAP_ALLOW_LOCAL_TEST_MUTATIONS="true"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export FISIOZAP_ADMIN_EMAIL="ci-admin@fisiozap.local"
          export FISIOZAP_ADMIN_PASSWORD="ci-admin-password-only-local"
          export FISIOZAP_TEST_EMAIL="ci-professional@fisiozap.local"
          export FISIOZAP_TEST_PASSWORD="ci-professional-password-only-local"
          export FISIOZAP_TEST_ORG="FisioZap CI RLS"
          node scripts/bootstrap-test-accounts.mjs
          node scripts/rls-negative-test.mjs
