name: TESTES — FisioZap

on:
  push:
    branches: [TESTES]
  pull_request:
    branches: [TESTES, main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Initialize local Supabase config
        run: supabase init --force
      - name: Validate migration dollar quoting
        run: |
          if grep -RInE '^\s*do \$\s*$|^\s*end \$\s*;' supabase/migrations; then
            echo "Invalid PostgreSQL dollar-quoting detected. Use do $ ... end $;."
            exit 1
          fi
      - name: Start local Supabase database only
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Reset from migrations
        run: supabase db reset --local --no-seed
      - name: Lint local schema
        run: supabase db lint --local --fail-on error --schema public
